[project]
name = "zdog-baby-server"
version = "0.1.0"
description = "Flask API for private baby supplies management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["flask>=3.1,<4", "python-dotenv>=1,<2", "requests>=2.32,<3", "waitress>=3,<4"]

[project.scripts]
baby-server = "baby_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baby_server"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
